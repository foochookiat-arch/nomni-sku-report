name: Daily Nomni SKU spending report

on:
  schedule:
    - cron: '47 1 * * *'   # 09:47 Singapore time daily (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Day to export (YYYY-MM-DD). Leave blank for yesterday.'
        required: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Download yesterday's SKU spending report
        env:
          NOMNI_EMAIL: ${{ secrets.NOMNI_EMAIL }}
          NOMNI_PASSWORD: ${{ secrets.NOMNI_PASSWORD }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}
        run: npm run fetch

      - name: Save report to the repo
        run: |
          git config user.name "nomni-report-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "SKU spending report $(ls -t reports | head -1)"
          git push

      - name: Send report to the recipe costing app
        env:
          RECIPE_APP_URL: ${{ secrets.RECIPE_APP_URL }}
          PRICE_IMPORT_TOKEN: ${{ secrets.PRICE_IMPORT_TOKEN }}
          # Vercel -> Settings -> Deployment Protection -> Protection Bypass for Automation
          VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
        run: |
          if [ -z "$RECIPE_APP_URL" ] || [ -z "$PRICE_IMPORT_TOKEN" ]; then
            echo "RECIPE_APP_URL / PRICE_IMPORT_TOKEN secrets not set - skipping the upload"; exit 0
          fi
          file=$(ls -t reports/*.xlsx | head -1)
          echo "Importing $file"
          bypass=()
          [ -n "$VERCEL_BYPASS_SECRET" ] && bypass=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET")
          status=$(curl -sS -o response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $PRICE_IMPORT_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            "${bypass[@]}" \
            --data-binary @"$file" \
            "${RECIPE_APP_URL%/}/api/price-list/import?file=$(basename "$file")")
          echo "HTTP $status"
          head -c 2000 response.txt; echo
          if [ "$status" != 200 ]; then
            if [ "${status:0:1}" = 3 ]; then
              echo "::error::The app redirected the upload - usually Vercel Authentication. Add the VERCEL_BYPASS_SECRET repo secret (see README)."
            else
              echo "::error::The app did not accept the report (HTTP $status)."
            fi
            exit 1
          fi

      - name: Keep a copy as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: sku-report
          path: reports/
          retention-days: 30

      - name: Upload screenshot if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshot
          path: debug/
